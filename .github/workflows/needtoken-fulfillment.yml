name: NeedToken fulfillment

on:
  pull_request:
    paths:
      - "controller/**"
      - "middleware/**"
      - "model/**"
      - "router/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/needtoken-fulfillment.yml"
  push:
    branches: [main]
    paths:
      - "controller/**"
      - "middleware/**"
      - "model/**"
      - "router/**"
      - ".github/workflows/needtoken-fulfillment.yml"

permissions:
  contents: read

jobs:
  native-grants:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only
          MYSQL_DATABASE: granttest
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci-local-only"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: glue
          POSTGRES_DB: granttest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glue" --health-interval 5s
          --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: Configure isolated MySQL database for native charset validation
        run: >-
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pci-local-only
          -e 'ALTER DATABASE granttest CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - run: go vet ./model ./middleware ./controller ./router
      - name: Native grants and adjacent regressions on all three databases
        env:
          TEST_MYSQL_DSN: "root:ci-local-only@tcp(127.0.0.1:3306)/granttest?charset=utf8mb4&parseTime=True&loc=Local"
          TEST_POSTGRES_DSN: "postgres://glue@127.0.0.1:5432/granttest?sslmode=disable"
        run: go test ./model ./middleware ./controller ./router -count=1 -timeout=180s
